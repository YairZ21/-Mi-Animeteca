<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Animeteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Encabezado: título de la app y contador de títulos guardados -->
  <div class="header">
    <div class="title-block">
      <h1 id="mainTitle">MI ANIMETECA</h1>
      <div class="sub" id="mainSubtitle">Catálogo personal · lo que ya viste, ordenado y calificado</div>
    </div>
    <div class="header-right">
      <button class="accent-picker-btn" id="accentPickerBtn" title="Elegir color de acento">
        <span class="accent-picker-swatch" id="accentPickerSwatch"></span>
      </button>
      <input type="color" id="accentColorInput" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;">

      <div class="count-badge" id="countBadge">
        <b id="countNum">0</b>
        títulos archivados
      </div>
    </div>
  </div>

  <!-- Pestañas de nivel superior -->
  <div class="page-tabs" id="pageTabs">
    <button class="page-tab active" data-page="collection">Colección</button>
    <button class="page-tab" data-page="stats">📊 Estadísticas</button>
  </div>

  <div id="collectionView">

  <!-- Pestañas para elegir cómo agregar un anime -->
  <div class="add-mode-row">
    <button class="mode-tab active" id="tabSearch">Buscar anime</button>
    <button class="mode-tab" id="tabManual">Agregar manualmente</button>
  </div>

  <!-- Modo "Buscar anime" -->
  <div class="search-box" id="searchBox">
    <input id="searchInput" type="text" placeholder="Buscar un anime para añadirlo (ej: Fullmetal Alchemist)" />
    <button id="searchBtn">Buscar</button>
  </div>
  <div class="search-status" id="searchStatus" style="display:none;"></div>
  <div class="results" id="results"></div>

  <!-- Modo "Agregar manualmente" -->
  <div class="manual-form" id="manualForm">
    <div class="manual-grid">
      <div>
        <img id="manualPreview" class="manual-preview" src="" alt="" style="display:none;">
        <div class="file-row">
          <label style="margin-top:10px;">Subir imagen desde tu dispositivo</label>
          <input type="file" id="manualFile" accept="image/*">
        </div>
      </div>
      <div>
        <div class="field">
          <label>Título *</label>
          <input type="text" id="manualTitle" placeholder="Nombre del anime">
        </div>
        <div class="field">
          <label>URL de imagen (opcional si subiste un archivo)</label>
          <input type="url" id="manualImageUrl" placeholder="https://...">
        </div>
        <div class="field">
          <label>Género(s) — separados por coma</label>
          <input type="text" id="manualGenres" placeholder="Acción, Aventura, Fantasía">
        </div>
        <div class="manual-two-col">
          <div class="field">
            <label>Tipo</label>
            <select id="manualType"></select>
          </div>
          <div class="field">
            <label>Año de emisión</label>
            <input type="text" inputmode="numeric" id="manualYear" placeholder="2024">
          </div>
        </div>
        <div class="manual-two-col">
          <div class="field">
            <label>Episodios</label>
            <input type="text" inputmode="numeric" id="manualEpisodes" placeholder="12">
          </div>
          <div class="field">
            <label>Temporada</label>
            <select id="manualSeasonNumber"></select>
          </div>
        </div>
        <div class="manual-two-col">
          <div class="field">
            <label>Calificación (opcional)</label>
            <select id="manualRating"></select>
          </div>
          <div class="field">
            <label>Estado</label>
            <select id="manualWatchStatus"></select>
          </div>
        </div>
        <div class="field">
          <label>Episodio actual (progreso, opcional)</label>
          <input type="text" inputmode="numeric" id="manualCurrentEpisode" placeholder="ej. 8">
        </div>
        <div class="field">
          <label>Precuela (vínculo manual)</label>
          <div id="manualLinkPrequelPicker"></div>
        </div>
        <div class="field">
          <label>Secuela (vínculo manual)</label>
          <div id="manualLinkSequelPicker"></div>
        </div>
        <div class="field">
          <label>Sinopsis</label>
          <textarea id="manualSynopsis" placeholder="Breve descripción del anime..."></textarea>
        </div>
        <div class="field">
          <label>Notas personales (opcional, aparte de la sinopsis)</label>
          <textarea id="manualNotes" placeholder="Tus propios comentarios sobre este anime..."></textarea>
        </div>
        <div class="manual-actions">
          <button class="btn-primary" id="manualSubmit">Añadir a mi animeteca</button>
          <button class="btn-ghost" id="manualCancel">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- "Mis Listas" -->
  <div class="watch-tabs-heading">Mis Listas</div>
  <div class="watch-tabs" id="watchTabs">
    <button class="watch-tab active" data-status="todo">Todo</button>
    <button class="watch-tab" data-status="viendo">Viendo</button>
    <button class="watch-tab" data-status="por-ver">Por Ver</button>
    <button class="watch-tab" data-status="completado">Completado</button>
    <button class="watch-tab" data-status="pausado">Pausado</button>
    <button class="watch-tab" data-status="descartado">Descartado</button>
  </div>

  <!-- Respaldo -->
  <div class="controls">
    <div class="backup-group">
      <button class="backup-btn" id="exportBtn">Exportar respaldo (.json)</button>
      <button class="backup-btn" id="exportHtmlBtn">Exportar lista (PDF con carátulas)</button>
      <button class="backup-btn" id="importBtn">Importar respaldo</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </div>

  <div class="sticky-controls">
    <div class="controls controls-spread">
      <div class="sort-group" id="sortGroup">
        <button class="sort-btn active" data-sort="alpha">A – Z</button>
        <button class="sort-btn" data-sort="rating">Mejor valorados</button>
        <button class="sort-btn" data-sort="recent">Añadidos recientemente</button>
      </div>
      <div class="view-group" id="viewGroup">
        <button class="view-btn active" data-view="large" title="Miniatura grande">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
        </button>
        <button class="view-btn" data-view="medium" title="Miniatura mediana">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="16" y="2" width="6" height="6" rx="1"/><rect x="2" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><rect x="16" y="9" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/></svg>
        </button>
        <button class="view-btn" data-view="small" title="Miniatura pequeña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="1" width="4" height="4"/><rect x="7" y="1" width="4" height="4"/><rect x="13" y="1" width="4" height="4"/><rect x="19" y="1" width="4" height="4"/><rect x="1" y="7" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/><rect x="19" y="7" width="4" height="4"/><rect x="1" y="13" width="4" height="4"/><rect x="7" y="13" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><rect x="19" y="13" width="4" height="4"/></svg>
        </button>
      </div>
    </div>

    <div class="controls">
      <div class="library-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="librarySearchInput" placeholder="Buscar en tu lista…">
      </div>
      <div class="filter-group">
        <select id="genreFilter">
          <option value="all">Todos los géneros</option>
        </select>
        <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <div class="rail" id="rail"></div>
  </div>

  <div id="listArea"></div>

  </div><!-- fin de #collectionView -->

  <div id="statsView" style="display:none;"></div>

</div>

<!-- Modal reutilizable -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Diálogo de confirmación -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-actions">
      <button class="btn-ghost" id="confirmCancelBtn">Cancelar</button>
      <button class="btn-primary" id="confirmOkBtn">Confirmar</button>
    </div>
  </div>
</div>

<div class="hover-preview" id="hoverPreview"></div>

<script>
(function(){

  const STORAGE_KEY = 'lista-anime';
  let animeList = [];
  let currentSort = 'alpha';
  let currentGenre = 'all';
  let currentWatchStatus = 'todo';
  let currentView = localStorage.getItem('vista-animeteca') || 'large';
  let libraryQuery = '';
  let lastSearchResults = [];
  let loaded = false;

  const el = {
    input: document.getElementById('searchInput'),
    searchBtn: document.getElementById('searchBtn'),
    results: document.getElementById('results'),
    searchStatus: document.getElementById('searchStatus'),
    listArea: document.getElementById('listArea'),
    countNum: document.getElementById('countNum'),
    mainTitle: document.getElementById('mainTitle'),
    mainSubtitle: document.getElementById('mainSubtitle'),
    accentPickerBtn: document.getElementById('accentPickerBtn'),
    accentPickerSwatch: document.getElementById('accentPickerSwatch'),
    accentColorInput: document.getElementById('accentColorInput'),
    hoverPreview: document.getElementById('hoverPreview'),
    rail: document.getElementById('rail'),
    sortGroup: document.getElementById('sortGroup'),
    genreFilter: document.getElementById('genreFilter'),
    viewGroup: document.getElementById('viewGroup'),
    librarySearchInput: document.getElementById('librarySearchInput'),
    exportBtn: document.getElementById('exportBtn'),
    exportHtmlBtn: document.getElementById('exportHtmlBtn'),
    importBtn: document.getElementById('importBtn'),
    importFile: document.getElementById('importFile'),
    tabSearch: document.getElementById('tabSearch'),
    tabManual: document.getElementById('tabManual'),
    searchBox: document.getElementById('searchBox'),
    manualForm: document.getElementById('manualForm'),
    manualPreview: document.getElementById('manualPreview'),
    manualFile: document.getElementById('manualFile'),
    manualTitle: document.getElementById('manualTitle'),
    manualImageUrl: document.getElementById('manualImageUrl'),
    manualGenres: document.getElementById('manualGenres'),
    manualType: document.getElementById('manualType'),
    manualYear: document.getElementById('manualYear'),
    manualEpisodes: document.getElementById('manualEpisodes'),
    manualSeasonNumber: document.getElementById('manualSeasonNumber'),
    manualRating: document.getElementById('manualRating'),
    manualWatchStatus: document.getElementById('manualWatchStatus'),
    manualSynopsis: document.getElementById('manualSynopsis'),
    manualCurrentEpisode: document.getElementById('manualCurrentEpisode'),
    manualNotes: document.getElementById('manualNotes'),
    manualLinkPrequel: document.getElementById('manualLinkPrequelPicker'),
    manualLinkSequel: document.getElementById('manualLinkSequelPicker'),
    manualSubmit: document.getElementById('manualSubmit'),
    manualCancel: document.getElementById('manualCancel'),
    modalOverlay: document.getElementById('modalOverlay'),
    modalContent: document.getElementById('modalContent'),
    modalClose: document.getElementById('modalClose'),
    confirmOverlay: document.getElementById('confirmOverlay'),
    confirmMessage: document.getElementById('confirmMessage'),
    confirmOkBtn: document.getElementById('confirmOkBtn'),
    confirmCancelBtn: document.getElementById('confirmCancelBtn'),
    watchTabs: document.getElementById('watchTabs'),
    pageTabs: document.getElementById('pageTabs'),
    collectionView: document.getElementById('collectionView'),
    statsView: document.getElementById('statsView'),
  };

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function setStatus(msg, isError){
    if(!msg){ el.searchStatus.style.display='none'; return; }
    el.searchStatus.style.display='block';
    el.searchStatus.textContent = msg;
    el.searchStatus.className = 'search-status' + (isError ? ' error' : '');
  }

  function splitGenres(str){
    return String(str || '')
      .split(/[,;/]+|\s-\s/)
      .map(g => g.trim())
      .filter(Boolean);
  }

  async function loadList(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      animeList = raw ? JSON.parse(raw) : [];
    }catch(e){
      animeList = [];
    }

    let migrated = false;
    animeList.forEach(a => {
      if(Array.isArray(a.genres) && a.genres.length === 1 && /\s-\s|\/|;/.test(a.genres[0])){
        a.genres = splitGenres(a.genres[0]);
        migrated = true;
      }
      if(!a.watchStatus){
        a.watchStatus = 'completado';
        migrated = true;
      }
    });
    if(migrated) saveList();

    loaded = true;
    render();

    (async () => {
      await backfillMissingDetails();
      await backfillSynopsisTranslation();
      await backfillRelations();
      await backfillNextEpisode();
    })();
  }

  const ANILIST_BY_MAL_ID_QUERY = 'query ($id: Int) { Media(idMal: $id, type: ANIME) { format episodes seasonYear status nextAiringEpisode { episode airingAt } } }';

  async function backfillMissingDetails(){
    const targets = animeList.filter(a => typeof a.id === 'number' && (!a.type || !a.year || !a.episodes));
    if(targets.length === 0) return;
    let changed = false;
    for(const a of targets){
      try{
        const resp = await fetchAniListGraphQL(ANILIST_BY_MAL_ID_QUERY, {id: a.id});
        if(resp.ok){
          const json = await resp.json();
          const d = json && json.data && json.data.Media;
          if(d){
            if(!a.type && d.format){ a.type = d.format; changed = true; }
            if(!a.year && d.seasonYear){ a.year = d.seasonYear; changed = true; }
            if(!a.episodes && d.episodes){ a.episodes = d.episodes; changed = true; }
            if(!a.status && d.status){ a.status = d.status; changed = true; }
          }
        }
      }catch(e){}
      await sleep(2200);
    }
    if(changed){
      saveList();
      render();
      if(currentModalId){
        const current = animeList.find(x => x.id === currentModalId);
        if(current) openModal(current.id);
      }
    }
  }

  async function backfillSynopsisTranslation(){
    const targets = animeList.filter(a => !isManualId(a.id) && a.synopsis && !a.synopsisEs);
    if(targets.length === 0) return;
    let changed = false;
    for(const a of targets){
      try{
        const translated = await translateToSpanish(a.synopsis);
        if(translated){
          a.synopsis = translated;
          a.synopsisEs = true;
          changed = true;
        }
      }catch(e){}
      await sleep(1500);
    }
    if(changed){
      saveList();
      render();
      if(currentModalId){
        const current = animeList.find(x => x.id === currentModalId);
        if(current) openModal(current.id);
      }
    }
  }

  async function backfillRelations(){
    const targets = animeList.filter(a => a.relFetched !== true && a.id.indexOf('al-') === 0).slice(0, 4);
    if(targets.length === 0) return;
    let changed = false;
    for(const a of targets){
      try{
        const anilistId = parseInt(a.id.slice(3), 10);
        const full = anilistId ? await fetchAniListById(anilistId) : null;
        const rel = full ? extractRelations(full) : {relPrequel: null, relSequel: null};
        a.relPrequel = rel.relPrequel;
        a.relSequel = rel.relSequel;
        a.relFetched = true;
        changed = true;
      }catch(e){}
      await sleep(900);
    }
    if(changed){
      saveList();
      render();
      if(currentModalId){
        const current = animeList.find(x => x.id === currentModalId);
        if(current) openModal(current.id);
      }
    }
  }

  async function backfillNextEpisode(){
    const targets = animeList
      .filter(a => a.status === 'RELEASING' && a.id.indexOf('al-') === 0 &&
        (!a.nextAiringAt || (a.nextAiringAt * 1000) < Date.now()))
      .slice(0, 8);
    if(targets.length === 0) return;
    let changed = false;
    for(const a of targets){
      try{
        const anilistId = parseInt(a.id.slice(3), 10);
        const full = anilistId ? await fetchAniListById(anilistId) : null;
        if(full){
          a.nextEpisode = (full.nextAiringEpisode && full.nextAiringEpisode.episode) || null;
          a.nextAiringAt = (full.nextAiringEpisode && full.nextAiringEpisode.airingAt) || null;
          if(full.status) a.status = full.status;
          changed = true;
        }
      }catch(e){}
      await sleep(900);
    }
    if(changed){
      saveList();
      render();
      if(currentModalId){
        const current = animeList.find(x => x.id === currentModalId);
        if(current) openModal(current.id);
      }
    }
  }

  async function saveList(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(animeList));
    }catch(e){
      setStatus('No se pudo guardar el cambio en este navegador.', true);
    }
  }

  let searching = false;
  function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

  async function fetchAniListGraphQL(query, variables){
    const body = JSON.stringify({query, variables});
    const headers = {'Content-Type':'application/json', 'Accept':'application/json'};
    const routes = [
      () => fetch('https://graphql.anilist.co', {method:'POST', headers, body}),
      () => fetch('https://corsproxy.io/?url=' + encodeURIComponent('https://graphql.anilist.co'), {method:'POST', headers, body}),
      () => fetch('https://proxy.cors.sh/https://graphql.anilist.co', {method:'POST', headers, body})
    ];
    let lastErr;
    for(const attempt of routes){
      try{ return await attempt(); }catch(e){ lastErr = e; }
    }
    throw lastErr;
  }

  function stripHtml(str){
    if(!str) return '';
    const div = document.createElement('div');
    div.innerHTML = str;
    return (div.textContent || div.innerText || '').trim();
  }

  async function translateToSpanish(text){
    if(!text) return text;
    const resp = await fetch(
      'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=' + encodeURIComponent(text)
    );
    if(!resp.ok) throw new Error('translate-http-' + resp.status);
    const data = await resp.json();
    if(!Array.isArray(data) || !Array.isArray(data[0])) throw new Error('translate-bad-response');
    return data[0].map(segment => segment[0]).join('');
  }

  function isManualId(id){
    return typeof id === 'string' && id.indexOf('m-') === 0;
  }

  const RELATIONS_FIELDS = 'relations { edges { relationType node { id type title { romaji english } coverImage { large } } } }';
  const ANILIST_QUERY = 'query ($search: String) { Page(perPage: 8) { media(search: $search, type: ANIME, sort: SEARCH_MATCH) { id title { romaji english native } coverImage { large } description(asHtml: false) seasonYear episodes format status genres nextAiringEpisode { episode airingAt } ' + RELATIONS_FIELDS + ' } } }';

  async function fetchAniList(q, attempt){
    const resp = await fetchAniListGraphQL(ANILIST_QUERY, {search: q});
    if(resp.status === 429){
      if(attempt < 2){
        await sleep(1500 * (attempt + 1));
        return fetchAniList(q, attempt + 1);
      }
      throw new Error('rate-limit');
    }
    if(!resp.ok){
      if(attempt < 1){
        await sleep(800);
        return fetchAniList(q, attempt + 1);
      }
      throw new Error('http-' + resp.status);
    }
    const json = await resp.json();
    if(json.errors && json.errors.length) throw new Error('api-error');
    return (json.data && json.data.Page && json.data.Page.media) || [];
  }

  function extractRelations(media){
    const edges = (media.relations && media.relations.edges) || [];
    function pick(relationType){
      const edge = edges.find(e => e.relationType === relationType && e.node && e.node.type === 'ANIME');
      if(!edge) return null;
      const n = edge.node;
      return {
        id: n.id,
        title: (n.title && (n.title.romaji || n.title.english)) || 'Sin título',
        image: (n.coverImage && n.coverImage.large) || ''
      };
    }
    return {relPrequel: pick('PREQUEL'), relSequel: pick('SEQUEL')};
  }

  const ANILIST_BY_ID_QUERY = 'query ($id: Int) { Media(id: $id, type: ANIME) { id title { romaji english native } coverImage { large } description(asHtml: false) seasonYear episodes format status genres nextAiringEpisode { episode airingAt } ' + RELATIONS_FIELDS + ' } }';
  async function fetchAniListById(anilistId){
    try{
      const resp = await fetchAniListGraphQL(ANILIST_BY_ID_QUERY, {id: anilistId});
      if(!resp.ok) return null;
      const json = await resp.json();
      return (json.data && json.data.Media) || null;
    }catch(e){ return null; }
  }

  async function doSearch(){
    const q = el.input.value.trim();
    if(!q || searching) return;
    if(q.length < 3){
      setStatus('Escribe al menos 3 letras para buscar.', false);
      return;
    }
    searching = true;
    el.searchBtn.disabled = true;
    el.results.innerHTML = '';
    setStatus('Buscando "' + q + '"…', false);

    try{
      const media = await fetchAniList(q, 0);
      if(media.length === 0){
        setStatus('Sin resultados para "' + q + '". Prueba con otro título.', false);
      } else {
        setStatus('', false);
        lastSearchResults = media;
        renderResults(media);
      }
    }catch(e){
      setStatus('No se pudo buscar en este momento.', true);
    }finally{
      searching = false;
      el.searchBtn.disabled = false;
    }
  }

  function renderResults(mediaList){
    el.results.innerHTML = '';
    mediaList.forEach(m => {
      const title = (m.title && (m.title.romaji || m.title.english)) || 'Sin título';
      const img = (m.coverImage && m.coverImage.large) || '';
      const year = m.seasonYear || '—';
      const eps = m.episodes || '?';
      const alreadyAdded = animeList.some(a => a.id === 'al-' + m.id);
      const card = document.createElement('div');
      card.className = 'result-card' + (alreadyAdded ? ' already-added' : '');
      card.innerHTML =
        '<img src="' + escapeHtml(img) + '" alt="">' +
        '<div>' +
          '<div class="r-title">' + escapeHtml(title) + '</div>' +
          '<div class="r-meta">' + escapeHtml(year) + ' · ' + escapeHtml(eps) + ' eps</div>' +
          (alreadyAdded
            ? '<div class="r-add r-add-done">✓ Ya en tu animeteca</div>'

  function finalizeAddAnime(m, type, seasonNumber, watchStatus, manualPrequelId, manualSequelId, currentEpisode, notes){
    const id = 'al-' + m.id;
    if(animeList.some(a => a.id === id)){
      setStatus('Ese título ya está en tu animeteca.', false);
      closeModal();
      return;
    }
    const title = (m.title && (m.title.romaji || m.title.english)) || 'Sin título';
    const finalSynopsis = (m._translatedSynopsis !== undefined)
      ? m._translatedSynopsis
      : (stripHtml(m.description) || 'Sin sinopsis disponible.');
    const rel = extractRelations(m);

    animeList.push({
      id: id,
      title: title,
      titleNative: (m.title && m.title.native) || null,
      titleEnglish: (m.title && m.title.english) || null,
      image: (m.coverImage && m.coverImage.large) || '',
      synopsis: finalSynopsis,
      synopsisEs: m._synopsisEs || false,
      year: m.seasonYear || null,
      episodes: m.episodes || null,
      type: type,
      status: m.status || null,
      seasonNumber: seasonNumber,
      genres: Array.isArray(m.genres) ? m.genres.slice() : [],
      rating: m._selectedRating || null,
      watchStatus: watchStatus || 'completado',
      relPrequel: rel.relPrequel,
      relSequel: rel.relSequel,
      relFetched: true,
      manualPrequelId: null,
      manualSequelId: null,
      currentEpisode: currentEpisode || null,
      notes: notes || '',
      nextEpisode: (m.nextAiringEpisode && m.nextAiringEpisode.episode) || null,
      nextAiringAt: (m.nextAiringEpisode && m.nextAiringEpisode.airingAt) || null,
      addedAt: Date.now()
    });

    if(manualPrequelId) setManualLink(id, 'prequel', manualPrequelId);
    if(manualSequelId) setManualLink(id, 'sequel', manualSequelId);

    saveList();
    render();
    closeModal();
    if(lastSearchResults.length) renderResults(lastSearchResults);
    setStatus('"' + title + '" añadido a tu animeteca. Puedes seguir agregando desde estos mismos resultados.', false);
  }

  function translateType(t){
    const map = {
      TV:'TV Anime', Movie:'Película', OVA:'OVA', ONA:'ONA', Special:'Especial', Music:'Música',
      MOVIE:'Película', SPECIAL:'Especial', MUSIC:'Música', TV_SHORT:'TV Anime'

  function translateStatus(s){

      'Finished Airing':'Finalizado','Currently Airing':'En emisión','Not yet aired':'Próximamente',
      FINISHED:'Finalizado', RELEASING:'En emisión', NOT_YET_RELEASED:'Próximamente', CANCELLED:'Cancelado', HIATUS:'En pausa'
    };
    return s ? (map[s] || s) : null;
  }
  const SEASON_ORDINALS = ['Primera','Segunda','Tercera','Cuarta','Quinta','Sexta','Séptima','Octava','Novena','Décima'];
  function seasonOrdinalLabel(n){
    const i = parseInt(n, 10);
    return (i >= 1 && i <= SEASON_ORDINALS.length) ? SEASON_ORDINALS[i-1] + ' Temporada' : null;
  }
  function formatRelativeFuture(unixSeconds){
    if(!unixSeconds) return null;
    const diffMs = (unixSeconds * 1000) - Date.now();
    if(diffMs <= 0) return null;
    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000) / 3600000);
    if(days >= 1) return 'en ' + days + (days === 1 ? ' día' : ' días');
    if(hours >= 1) return 'en ' + hours + (hours === 1 ? ' hora' : ' horas');
    return 'muy pronto';
  }
  function seasonOptionsHtml(selected){
    let html = '<option value="">Sin especificar</option>';
    SEASON_ORDINALS.forEach((label, idx) => {
      const val = idx + 1;
      html += '<option value="' + val + '"' + (String(selected) === String(val) ? ' selected' : '') + '>' + label + '</option>';
    });
    return html;
  }

  const SEASON_WORD_TO_NUM = {
    '1st':1, 'first':1, 'primera':1,
    '2nd':2, 'second':2, 'segunda':2,
    '3rd':3, 'third':3, 'tercera':3,
    '4th':4, 'fourth':4, 'cuarta':4,
    '5th':5, 'fifth':5, 'quinta':5,
    '6th':6, 'sixth':6, 'sexta':6,
    '7th':7, 'seventh':7, 'septima':7,
    '8th':8, 'eighth':8, 'octava':8,
    '9th':9, 'ninth':9, 'novena':9,
    '10th':10, 'tenth':10, 'decima':10
  };
  function guessSeasonNumber(text){
    if(!text) return null;
    const norm = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    let m = norm.match(/\b(1st|first|primera|2nd|second|segunda|3rd|third|tercera|4th|fourth|cuarta|5th|fifth|quinta|6th|sixth|sexta|7th|seventh|septima|8th|eighth|octava|9th|ninth|novena|10th|tenth|decima)\s+(season|stage|cour|part|temporada|parte)\b/i);
    if(m) return SEASON_WORD_TO_NUM[m[1].toLowerCase()] || null;
    m = norm.match(/\b(?:season|part|cour|temporada|parte)\s+(\d{1,2})\b/i);
    if(m) return parseInt(m[1], 10);
    m = norm.match(/\b(\d{1,2})\s*(?:da|do|ra|to|va|nd|rd|th|st)?\.?\s*temporada\b/i);
    if(m) return parseInt(m[1], 10);
    m = text.match(/第\s*(\d{1,2})\s*期/);
    if(m) return parseInt(m[1], 10);
    return null;
  }
  function guessSeasonNumberFromSources(sources){
    for(const text of sources){
      const guess = guessSeasonNumber(text);
      if(guess) return guess;
    }
    return null;
  }

  function normalizeTitleForMatch(title){
    if(!title) return '';
    let t = title.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    t = t.replace(/\b(1st|first|primera|2nd|second|segunda|3rd|third|tercera|4th|fourth|cuarta|5th|fifth|quinta|6th|sixth|sexta|7th|seventh|septima|8th|eighth|octava|9th|ninth|novena|10th|tenth|decima)\s+(season|stage|cour|part|temporada|parte)\b/gi, ' ');
    t = t.replace(/\b(?:season|part|cour|temporada|parte)\s+\d{1,2}\b/gi, ' ');
    t = t.replace(/\b\d{1,2}\s*(?:da|do|ra|to|va)?\.?\s*temporada\b/gi, ' ');
    t = t.replace(/第\s*\d{1,2}\s*期/g, ' ');
    t = t.replace(/[:\-–—]?\s*\b(\d{1,2}|ii|iii|iv|vi|vii|viii|ix|x)\s*$/i, '');
    t = t.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    return t;
  }

  function findLocalRelation(anime, direction){
    if(!anime.seasonNumber) return null;
    const targetSeason = anime.seasonNumber + direction;
    if(targetSeason < 1) return null;
    const base = normalizeTitleForMatch(anime.title);
    if(!base) return null;
    const match = animeList.find(x =>
      x.id !== anime.id &&
      x.seasonNumber === targetSeason &&
      normalizeTitleForMatch(x.title) === base
    );
    return match ? {id: match.id, title: match.title, image: match.image, isLocal: true} : null;
  }

  function setManualLink(animeId, linkType, targetId){
    const a = animeList.find(x => x.id === animeId);
    if(!a) return;
    const ownField = linkType === 'prequel' ? 'manualPrequelId' : 'manualSequelId';
    const otherFieldOnTarget = linkType === 'prequel' ? 'manualSequelId' : 'manualPrequelId';

    const prevTargetId = a[ownField];
    if(prevTargetId && prevTargetId !== targetId){
      const prevTarget = animeList.find(x => x.id === prevTargetId);
      if(prevTarget && prevTarget[otherFieldOnTarget] === a.id){
        prevTarget[otherFieldOnTarget] = null;
      }
    }
    a[ownField] = targetId || null;
    if(targetId){
      const target = animeList.find(x => x.id === targetId);
      if(target) target[otherFieldOnTarget] = a.id;
    }
  }

  function buildLinkPickerHtml(pickerId, excludeId, selectedId){
    const selected = selectedId ? animeList.find(x => x.id === selectedId) : null;
    const triggerInner = selected
      ? '<img src="' + escapeHtml(selected.image) + '" alt="">' +
        '<span class="link-picker-title">' + escapeHtml(selected.title) + '</span>' +

      : '<span class="link-picker-placeholder">Automático (detectar solo) — toca para elegir</span>';

    return (
      '<div class="link-picker" id="' + pickerId + '" data-selected-id="' + escapeHtml(selectedId || '') + '" data-exclude-id="' + escapeHtml(excludeId || '') + '">' +
        '<div class="link-picker-trigger" data-role="trigger">' + triggerInner + '</div>' +
        '<div class="link-picker-panel">' +
          '<input type="text" class="link-picker-search" placeholder="Buscar en tu colección...">' +
          '<div class="link-picker-grid" data-role="grid"></div>' +
        '</div>' +
      '</div>'
    );
  }

  function linkPickerTileHtml(x){
    return '<div class="link-picker-tile" data-id="' + escapeHtml(x.id) + '">' +
      '<img src="' + escapeHtml(x.image) + '" alt="">' +

  function renderLinkPickerGrid(pickerEl, filterText){
    const grid = pickerEl.querySelector('[data-role="grid"]');
    const excludeId = pickerEl.dataset.excludeId;
    const q = (filterText || '').trim().toLowerCase();
    const items = animeList
      .filter(x => x.id !== excludeId && (!q || x.title.toLowerCase().includes(q)))
      .sort((x, y) => x.title.localeCompare(y.title, 'es', {sensitivity:'base'}));
    grid.innerHTML = items.length
      ? items.map(linkPickerTileHtml).join('')
      : '<div class="link-picker-empty">Sin resultados</div>';
  }

  function wireLinkPicker(pickerId, onSelect){
    const pickerEl = document.getElementById(pickerId);
    if(!pickerEl) return;
    const trigger = pickerEl.querySelector('[data-role="trigger"]');
    const search = pickerEl.querySelector('.link-picker-search');
    let gridLoaded = false;

    function updateTrigger(){
      const selectedId = pickerEl.dataset.selectedId;
      const selected = selectedId ? animeList.find(x => x.id === selectedId) : null;
      trigger.innerHTML = selected
        ? '<img src="' + escapeHtml(selected.image) + '" alt="">' +
          '<span class="link-picker-title">' + escapeHtml(selected.title) + '</span>' +
          '<button type="button" class="link-picker-clear" data-role="clear" title="Quitar vínculo">✕</button>'
        : '<span class="link-picker-placeholder">Automático (detectar solo) — toca para elegir</span>';
    }

    trigger.addEventListener('click', (e) => {
      if(e.target.closest('[data-role="clear"]')){
        e.stopPropagation();
        pickerEl.dataset.selectedId = '';
        updateTrigger();
        if(onSelect) onSelect(null);
        return;
      }
      const isOpen = pickerEl.classList.contains('open');
      document.querySelectorAll('.link-picker.open').forEach(p => { if(p !== pickerEl) p.classList.remove('open'); });
      pickerEl.classList.toggle('open', !isOpen);
      if(!isOpen){
        if(!gridLoaded){ renderLinkPickerGrid(pickerEl, ''); gridLoaded = true; }
        search.value = '';
        search.focus();
      }
    });

    search.addEventListener('input', () => renderLinkPickerGrid(pickerEl, search.value));
    search.addEventListener('click', e => e.stopPropagation());

    pickerEl.querySelector('[data-role="grid"]').addEventListener('click', (e) => {
      const tile = e.target.closest('.link-picker-tile');
      if(!tile) return;
      pickerEl.dataset.selectedId = tile.dataset.id;
      updateTrigger();
      pickerEl.classList.remove('open');
      if(onSelect) onSelect(tile.dataset.id);
    });

    document.addEventListener('click', (e) => {
      if(!pickerEl.contains(e.target)) pickerEl.classList.remove('open');
    });
  }

  function getLinkPickerValue(pickerId){
    const el = document.getElementById(pickerId);
    return el ? (el.dataset.selectedId || null) : null;
  }

  function resolveRelated(a){
    const manualPrequel = a.manualPrequelId ? animeList.find(x => x.id === a.manualPrequelId) : null;
    const manualSequel = a.manualSequelId ? animeList.find(x => x.id === a.manualSequelId) : null;

    const prequel = manualPrequel
      ? {id: manualPrequel.id, title: manualPrequel.title, image: manualPrequel.image, isLocal: true}
      : (a.relPrequel
          ? {id: a.relPrequel.id, title: a.relPrequel.title, image: a.relPrequel.image, isLocal: false}
          : findLocalRelation(a, -1));
    const sequel = manualSequel
      ? {id: manualSequel.id, title: manualSequel.title, image: manualSequel.image, isLocal: true}
      : (a.relSequel

  function showConfirm(message, opts){
    opts = opts || {};
    return new Promise((resolve) => {
      el.confirmMessage.textContent = message;
      el.confirmOkBtn.textContent = opts.confirmText || 'Confirmar';
      el.confirmCancelBtn.textContent = opts.cancelText || 'Cancelar';
      el.confirmOkBtn.classList.toggle('btn-danger', !!opts.danger);
      el.confirmOverlay.classList.add('open');

      function cleanup(result){
        el.confirmOverlay.classList.remove('open');
        el.confirmOkBtn.removeEventListener('click', onOk);
        el.confirmCancelBtn.removeEventListener('click', onCancel);
        el.confirmOverlay.removeEventListener('click', onBackdrop);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      function onBackdrop(e){ if(e.target === el.confirmOverlay) cleanup(false); }
      function onKey(e){
        if(e.key === 'Escape'){ e.preventDefault(); cleanup(false); }
        else if(e.key === 'Enter'){ e.preventDefault(); cleanup(true); }
      }

      el.confirmOkBtn.addEventListener('click', onOk);
      el.confirmCancelBtn.addEventListener('click', onCancel);
      el.confirmOverlay.addEventListener('click', onBackdrop);
      document.addEventListener('keydown', onKey);
    });
  }

  function groupByLetter(list){
    const groups = {};
    list.forEach(a => {
      const letter = (a.title || '?').trim().charAt(0).toUpperCase();
      const key = /[A-Z]/.test(letter) ? letter : '#';
      if(!groups[key]) groups[key] = [];
      groups[key].push(a);
    });
    return groups;
  }

  function makeCard(a, index){
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = Math.min(index * 25, 300) + 'ms';

    const typeLabel = translateType(a.type);

    card.innerHTML =
      '<div class="poster-wrap">' +
        '<img class="thumb" src="' + escapeHtml(a.image) + '" alt="">' +
        '<div class="stamp-holder"></div>' +
      '</div>' +
      (typeLabel ? '<div class="type-chip">' + escapeHtml(typeLabel) + '</div>' : '') +
      '<div class="card-title">' + escapeHtml(a.title) + '</div>';

    const holder = card.querySelector('.stamp-holder');
    holder.addEventListener('click', e => e.stopPropagation());
    renderStamp(holder, a);

    if(hoverCapable){
      let hoverTimer = null;
      card.addEventListener('mouseenter', () => {
        hoverTimer = setTimeout(() => showHoverPreview(card, a), 400);
      });
      card.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
        hideHoverPreview();
      });
    }

    card.addEventListener('click', () => { hideHoverPreview(); openModal(a.id); });
    return card;
  }

  const hoverCapable = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);

  function showHoverPreview(card, a){
    const synText = a.synopsis || 'Sin sinopsis disponible.';
    const excerpt = synText.length > 180 ? synText.slice(0, 180).trim() + '…' : synText;
    const metaBits = [];
    if(a.year) metaBits.push(a.year);
    if(a.episodes) metaBits.push(a.episodes + ' eps');
    if(a.rating) metaBits.push('★ ' + a.rating);

    el.hoverPreview.innerHTML =
      '<div class="hover-preview-title">' + escapeHtml(a.title) + '</div>' +
      (metaBits.length ? '<div class="hover-preview-meta">' + escapeHtml(metaBits.join(' · ')) + '</div>' : '') +
      '<div class="hover-preview-text">' + escapeHtml(excerpt) + '</div>';

    el.hoverPreview.style.display = 'block';
    const rect = card.getBoundingClientRect();
    const previewRect = el.hoverPreview.getBoundingClientRect();

    let left = rect.right + 10;
    if(left + previewRect.width > window.innerWidth - 10){
      left = rect.left - previewRect.width - 10;
    }
    left = Math.max(10, left);

    let top = rect.top;
    if(top + previewRect.height > window.innerHeight - 10){
      top = window.innerHeight - previewRect.height - 10;
    }
    top = Math.max(10, top);

    el.hoverPreview.style.left = left + 'px';
    el.hoverPreview.style.top = top + 'px';
    requestAnimationFrame(() => el.hoverPreview.classList.add('visible'));
  }

  function hideHoverPreview(){
    el.hoverPreview.classList.remove('visible');
    el.hoverPreview.style.display = 'none';
  }

  function populateGenreFilter(){
    const genreSet = new Set();
    animeList.forEach(a => (a.genres||[]).forEach(g => genreSet.add(g)));
    const genres = [...genreSet].sort((a,b) => a.localeCompare(b,'es'));
    const prevValue = el.genreFilter.value || 'all';
    el.genreFilter.innerHTML = '<option value="all">Todos los géneros</option>' +
      genres.map(g => '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + '</option>').join('');
    el.genreFilter.value = genres.includes(prevValue) ? prevValue : 'all';
    currentGenre = el.genreFilter.value;
  }

  function render(){
    el.countNum.textContent = animeList.length;
    el.listArea.innerHTML = '';
    el.rail.innerHTML = '';

    if(!loaded) return;

    populateGenreFilter();

    if(animeList.length === 0){
      el.listArea.innerHTML =
        '<div class="empty-state"><div class="big">TU ANIMETECA ESTÁ VACÍA</div>' +
        'Busca un título arriba para empezar tu colección.</div>';
      return;
    }

    let filtered = animeList.slice();
    if(currentGenre !== 'all'){
      filtered = filtered.filter(a => a.genres && a.genres.includes(currentGenre));
    }
    if(libraryQuery){
      filtered = filtered.filter(a => a.title.toLowerCase().includes(libraryQuery));
    }
    if(currentWatchStatus !== 'todo'){
      filtered = filtered.filter(a => (a.watchStatus || 'completado') === currentWatchStatus);
    }

    if(filtered.length === 0){
      const reason = libraryQuery
        ? 'No hay nada que coincida con "' + escapeHtml(libraryQuery) + '".'
        : 'Prueba con otro filtro o elige "Todos los géneros".';
      el.listArea.innerHTML =
        '<div class="empty-state"><div class="big">SIN RESULTADOS</div>' + reason + '</div>';
      return;
    }

    let sorted = filtered.slice();
    if(currentSort === 'alpha'){
      sorted.sort((a,b) => a.title.localeCompare(b.title, 'es', {sensitivity:'base'}));
    } else if(currentSort === 'rating'){
      sorted.sort((a,b) => (b.rating||0) - (a.rating||0) || a.title.localeCompare(b.title,'es'));
    } else if(currentSort === 'recent'){
      sorted.sort((a,b) => b.addedAt - a.addedAt);
    }

    if(currentSort === 'alpha'){
      const groups = groupByLetter(sorted);
      const letters = Object.keys(groups).sort((a,b) => a.localeCompare(b,'es'));

      const fullAlpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      fullAlpha.forEach(L => {
        const a = document.createElement('a');
        a.textContent = L;
        if(groups[L]){
          a.classList.add('has-items');
          a.href = '#letter-' + L;
        } else {
          a.href = 'javascript:void(0)';
        }
        el.rail.appendChild(a);
      });

      let runningIndex = 0;
      letters.forEach(L => {
        const heading = document.createElement('div');
        heading.className = 'letter-heading';
        heading.id = 'letter-' + L;
        heading.textContent = L;
        el.listArea.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'grid' + (currentView !== 'large' ? ' size-' + currentView : '');
        groups[L].forEach(a => {
          grid.appendChild(makeCard(a, runningIndex));
          runningIndex++;
        });
        el.listArea.appendChild(grid);
      });
    } else {
      const grid = document.createElement('div');
      grid.className = 'grid' + (currentView !== 'large' ? ' size-' + currentView : '');
      sorted.forEach((a, i) => grid.appendChild(makeCard(a, i)));
      el.listArea.appendChild(grid);
    }
  }

  el.searchBtn.addEventListener('click', doSearch);
  el.input.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  el.input.addEventListener('input', () => {
    if(!el.input.value.trim()){
      el.results.innerHTML = '';
      lastSearchResults = [];
      setStatus('', false);
    }
  });

  el.sortGroup.addEventListener('click', e => {
    const btn = e.target.closest('.sort-btn');
    if(!btn) return;
    currentSort = btn.dataset.sort;
    [...el.sortGroup.children].forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  el.viewGroup.addEventListener('click', e => {
    const btn = e.target.closest('.view-btn');
    if(!btn) return;
    currentView = btn.dataset.view;
    try{ localStorage.setItem('vista-animeteca', currentView); }catch(e){}
    [...el.viewGroup.children].forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  el.librarySearchInput.addEventListener('input', () => {
    libraryQuery = el.librarySearchInput.value.trim().toLowerCase();
    render();
  });

  el.watchTabs.addEventListener('click', e => {
    const btn = e.target.closest('.watch-tab');
    if(!btn) return;
    currentWatchStatus = btn.dataset.status;
    [...el.watchTabs.children].forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  el.genreFilter.addEventListener('change', () => {
    currentGenre = el.genreFilter.value;
    render();
  });

  function readListFromStorage(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function buildBackupBlob(){
    const payload = {
      app: 'mi-animeteca',
      exportedAt: new Date().toISOString(),
      items: readListFromStorage(STORAGE_KEY)
    };
    return new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  }

function buildHtmlReport(){
    const sorted = animeList.slice().sort((a,b) => a.title.localeCompare(b.title, 'es', {sensitivity:'base'}));
    const stamp = new Date().toLocaleString('es');
    
    let html = `<!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="UTF-8">
    <title>Mi Animeteca - Lista Completa</title>
    <style>
      html, body { 
        margin: 0; 
        padding: 0; 
        background-color: #ffffff !important; /* Base blanca para camuflar los márgenes del navegador */
        color: #333333 !important; 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
      }
      .container {
        font-family: 'Inter', 'Helvetica Neue', sans-serif; 
        max-width: 1000px; 
        margin: 0 auto; 
        padding: 40px 20px; 
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid #2dd4bf !important; 
        padding-bottom: 18px;
        margin-bottom: 35px;
      }
      h1 { 
        font-family: 'Bebas Neue', sans-serif; 
        font-size: 46px; 
        letter-spacing: 1.5px; 
        margin: 0; 
        color: #111111 !important; 
        line-height: 1;
      }
      .meta { 
        color: #666666 !important; 
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px; 
      }
      
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px; 
      }
      .item { 
        display: flex; 
        align-items: center;
        gap: 20px; 
        background-color: #151830 !important; /* Recupera el color oscuro original de la app */
        border: 1px solid #2a2f4d !important;
        border-radius: 14px;
        padding: 20px;
        page-break-inside: avoid; 
        break-inside: avoid;
      }
      .item img { 
        width: 90px; 
        height: 130px; 
        object-fit: cover; 
        border-radius: 6px; 
        background: #000 !important; 
        flex-shrink: 0; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      }
      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
      }
      .title { 
        font-weight: 700; 
        font-size: 18px; 
        margin: 0 0 8px 0; 
        color: #e9ecf6 !important; /* Recupera el texto claro para que contraste */
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2; 
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .details { 
        font-size: 14px; 
        color: #8a90ab !important; /* Gris original de la app */
        margin: 0 0 14px 0; 
        line-height: 1.5; 
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rating-badge {
        display: inline-flex;
        align-items: center;
        background: rgba(8,9,15, 0.7) !important; /* Sello de calificación oscuro */
        padding: 8px 14px;
        border-radius: 8px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        font-weight: bold;
        width: fit-content;
      }
      .rating { color: #e2685f !important; } 
      .rating-special { color: #f4bb43 !important; text-shadow: 0 0 6px rgba(244,187,67,.4); } 
      
      @media print { 
        @page { margin: 1.5cm 1cm; size: A4; } 
        body { padding: 0; } 
        .container { padding: 0; max-width: 100%; margin: 0 auto; }
        .grid { gap: 20px; } 
      }
    </style>
    </head>
    <body>
      <div class="container">
        <div class="header">
          <h1>MI ANIMETECA</h1>
          <div class="meta">Exportado: ${stamp} &middot; Total: ${sorted.length} títulos</div>
        </div>
        <div class="grid">
    `;

    sorted.forEach(a => {
      const genres = (a.genres && a.genres.length) ? a.genres.join(', ') : 'Sin género';
      const isSpecial = a.rating === 11;
      const ratingText = (a.rating !== null && a.rating !== undefined) 
        ? (isSpecial ? '✦ Obra maestra' : `★ Calificación: ${a.rating}`) 
        : 'Sin calificar';
      const ratingClass = isSpecial ? 'rating-special' : 'rating';
      
      html += `
          <div class="item">
            <img src="${a.image || ''}" alt="">
            <div class="info">
              <p class="title">${escapeHtml(a.title)}</p>
              <p class="details">${escapeHtml(genres)}</p>
              <div class="rating-badge ${ratingClass}">${ratingText}</div>
            </div>
          </div>`;
    });

    html += `
        </div>
      </div>
    </body></html>`;
    return new Blob([html], {type: 'text/html'});
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  el.exportBtn.addEventListener('click', () => {
    if(animeList.length === 0){
      setStatus('Tu animeteca está vacía, no hay nada que exportar todavía.', false);
      return;
    }
    const stamp = new Date().toISOString().slice(0,10);
    downloadBlob(buildBackupBlob(), 'animeteca-respaldo-' + stamp + '.json');
    setStatus('Respaldo descargado: guarda ese archivo en un lugar seguro.', false);
  });

  el.exportHtmlBtn.addEventListener('click', () => {
    if(animeList.length === 0){
      setStatus('Tu animeteca está vacía, no hay nada que exportar todavía.', false);
      return;
    }
    const stamp = new Date().toISOString().slice(0,10);
    downloadBlob(buildHtmlReport(), 'animeteca-lista-' + stamp + '.html');
    setStatus('Lista descargada. Ábrela en tu navegador para ver las carátulas y presiona Ctrl+P si deseas guardarla como PDF.', false);
  });

  el.importBtn.addEventListener('click', () => el.importFile.click());

  function normalizeImportedItem(item){
    return {
      id: item.id,
      title: item.title,
      titleNative: item.titleNative || null,
      titleEnglish: item.titleEnglish || null,
      image: item.image || '',
      synopsis: item.synopsis || 'Sin sinopsis disponible.',
      year: item.year || null,
      episodes: item.episodes || null,
      type: item.type || null,
      status: item.status || null,
      seasonNumber: item.seasonNumber || null,
      genres: Array.isArray(item.genres) ? item.genres : [],
      rating: item.rating || null,
      watchStatus: item.watchStatus || 'completado',
      relPrequel: item.relPrequel || null,
      relSequel: item.relSequel || null,
      relFetched: item.relFetched === true,
      manualPrequelId: item.manualPrequelId || null,
      manualSequelId: item.manualSequelId || null,
      currentEpisode: item.currentEpisode || null,
      notes: item.notes || '',
      nextEpisode: item.nextEpisode || null,
      nextAiringAt: item.nextAiringAt || null,
      addedAt: item.addedAt || Date.now()
    };
  }

  function mergeItemsIntoStorageKey(key, incomingItems){
    const existing = readListFromStorage(key);
    let added = 0, skipped = 0;
    incomingItems.forEach(item => {
      if(item && typeof item.id !== 'undefined' && item.title){
        if(existing.some(a => a.id === item.id)){
          skipped++;
        } else {
          existing.push(normalizeImportedItem(item));
          added++;
        }
      }
    });
    try{ localStorage.setItem(key, JSON.stringify(existing)); }catch(e){}
    return {added, skipped};
  }

  el.importFile.addEventListener('change', () => {
    const file = el.importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        const items = Array.isArray(parsed) ? parsed : (parsed.items || []);

        if(items.length === 0){
          setStatus('El archivo no tiene un formato de respaldo válido.', true);
          return;
        }

        const result = mergeItemsIntoStorageKey(STORAGE_KEY, items);
        animeList = readListFromStorage(STORAGE_KEY);
        render();
        setStatus('Respaldo importado: ' + result.added + ' añadidos, ' + result.skipped + ' ya existían.', false);
      }catch(e){
        setStatus('No se pudo leer el archivo. Asegúrate de que sea un respaldo exportado desde aquí.', true);
      }
      el.importFile.value = '';
    };
    reader.readAsText(file);
  });

  [...el.viewGroup.children].forEach(b => b.classList.toggle('active', b.dataset.view === currentView));

  el.pageTabs.addEventListener('click', e => {
    const btn = e.target.closest('.page-tab');
    if(!btn) return;
    [...el.pageTabs.children].forEach(b => b.classList.toggle('active', b === btn));
    if(btn.dataset.page === 'stats'){
      el.collectionView.style.display = 'none';
      el.statsView.style.display = 'block';
      renderStats();
    } else {
      el.statsView.style.display = 'none';
      el.collectionView.style.display = 'block';
    }
  });

  function computeStats(){
    const total = animeList.length;
    const rated = animeList.filter(a => a.rating !== null && a.rating !== undefined);
    const avgRating = rated.length
      ? (rated.reduce((sum, a) => sum + a.rating, 0) / rated.length)
      : null;
    const masterpieces = animeList.filter(a => a.rating === RATING_SPECIAL).length;

    const episodesWatched = animeList.reduce((sum, a) => {
      const status = a.watchStatus || 'completado';
      if(status === 'completado') return sum + (Number(a.episodes) || 0);
      if(status === 'viendo' || status === 'pausado') return sum + (Number(a.currentEpisode) || 0);
      return sum;
    }, 0);

    const byStatus = {};
    WATCH_STATUSES.forEach(w => byStatus[w.value] = 0);
    animeList.forEach(a => {
      const s = a.watchStatus || 'completado';
      byStatus[s] = (byStatus[s] || 0) + 1;
    });

    const genreCount = {};
    animeList.forEach(a => (a.genres || []).forEach(g => { genreCount[g] = (genreCount[g] || 0) + 1; }));
    const topGenres = Object.entries(genreCount).sort((a,b) => b[1] - a[1]).slice(0, 6);

    return {total, avgRating, masterpieces, episodesWatched, byStatus, topGenres};
  }

  function renderStats(){
    const s = computeStats();

    if(s.total === 0){
      el.statsView.innerHTML =
        '<div class="empty-state"><div class="big">TODAVÍA NO HAY DATOS</div>' +
        'Agrega algunos animes a tu colección y vuelve aquí para ver tus estadísticas.</div>';
      return;
    }

    const statCardsHtml =
      '<div class="stat-cards">' +
        '<div class="stat-card"><div class="stat-num">' + s.total + '</div><div class="stat-label">Animes en tu archivo</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.byStatus['completado'] + '</div><div class="stat-label">Completados</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.byStatus['viendo'] + '</div><div class="stat-label">Viendo</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.byStatus['por-ver'] + '</div><div class="stat-label">Por Ver</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.byStatus['pausado'] + '</div><div class="stat-label">Pausados</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.byStatus['descartado'] + '</div><div class="stat-label">Descartados</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + (s.avgRating !== null ? s.avgRating.toFixed(1) : '—') + '</div><div class="stat-label">Calificación promedio</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.episodesWatched.toLocaleString('es') + '</div><div class="stat-label">Episodios vistos</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + s.masterpieces + ' ✦</div><div class="stat-label">Obras maestra</div></div>' +
      '</div>';

    const maxStatus = Math.max(1, ...WATCH_STATUSES.map(w => s.byStatus[w.value]));
    const statusBarsHtml =
      '<div class="stats-block">' +
        '<div class="stats-block-title">Por estado</div>' +
        WATCH_STATUSES.map(w => {
          const count = s.byStatus[w.value];
          const pct = Math.round((count / maxStatus) * 100);
          return '<div class="stat-bar-row">' +
            '<div class="stat-bar-label">' + escapeHtml(w.label) + '</div>' +
            '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:' + pct + '%;"></div></div>' +
            '<div class="stat-bar-count">' + count + '</div>' +
          '</div>';
        }).join('') +
      '</div>';

    const maxGenre = s.topGenres.length ? s.topGenres[0][1] : 1;
    const genresHtml =
      '<div class="stats-block">' +
        '<div class="stats-block-title">Géneros más vistos</div>' +
        (s.topGenres.length
          ? s.topGenres.map(([genre, count]) => {
              const pct = Math.round((count / maxGenre) * 100);
              return '<div class="stat-bar-row">' +
                '<div class="stat-bar-label">' + escapeHtml(genre) + '</div>' +
                '<div class="stat-bar-track"><div class="stat-bar-fill genre-fill" style="width:' + pct + '%;"></div></div>' +
                '<div class="stat-bar-count">' + count + '</div>' +
              '</div>';
            }).join('')
          : '<div class="search-hint">Todavía no hay géneros registrados.</div>')+
      '</div>';

    el.statsView.innerHTML =
      '<div class="stats-heading">Estadísticas de tu animeteca</div>' +
      statCardsHtml +
      '<div class="stats-columns">' + statusBarsHtml + genresHtml + '</div>';
  }

  function hexToRgb(hex){
    const h = hex.replace('#', '');
    const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    const n = parseInt(full, 16);
    return {r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255};
  }
  function rgbToHex(r, g, b){
    return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  }
  function darkenHex(hex, factor){
    const {r, g, b} = hexToRgb(hex);
    return rgbToHex(r * factor, g * factor, b * factor);
  }
  function applyAccentColor(hex){
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-hover', darkenHex(hex, 0.82));
    el.accentPickerSwatch.style.background = hex;
    el.accentColorInput.value = hex;
  }
  const savedAccent = localStorage.getItem('acento-color');
  if(savedAccent) applyAccentColor(savedAccent);

  el.accentPickerBtn.addEventListener('click', () => el.accentColorInput.click());
  el.accentColorInput.addEventListener('input', () => {
    const hex = el.accentColorInput.value;
    applyAccentColor(hex);
    try{ localStorage.setItem('acento-color', hex); }catch(e){}
  });

  loadList();
})();
</script>
</body>
</html>
