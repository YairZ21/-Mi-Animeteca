name: Compilar Mi Animeteca para Windows

# Se ejecuta solo: cada vez que subes cambios a la rama "main", o si lo
# lanzas a mano desde la pestaña "Actions" de GitHub ("Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Compilar el .exe
        run: cargo tauri build

      - name: Publicar el .exe (se ve en la pestaña "Actions" de este repo)
        uses: actions/upload-artifact@v4
        with:
          name: MiAnimeteca-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
