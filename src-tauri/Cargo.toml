[package]
name = "mi-animeteca"
version = "1.0.0"
description = "Catálogo personal de anime"
authors = ["Mi Animeteca"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
